# Deploy classroom entities to an EXISTING ThingsBoard on the same Linux AWS host.
name: classroom-bootstrap
services:
  bootstrap:
    build: {context: .., dockerfile: deployment/Dockerfile.bootstrap}
    network_mode: host
    user: "${HOST_UID:-0}:${HOST_GID:-0}"
    restart: "no"
    env_file: .env
    environment:
      TB_BASE_URL: http://127.0.0.1
    volumes: [./runtime:/runtime]

