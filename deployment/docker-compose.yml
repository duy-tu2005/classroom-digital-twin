name: ${COMPOSE_PROJECT_NAME:-classroom-twin}
x-database: &database
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-thingsboard}
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Run deployment/init-env.py first}
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thingsboard}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run deployment/init-env.py first}
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]
  thingsboard-install:
    image: thingsboard/tb-node:4.3.1.5
    profiles: [init]
    restart: "no"
    environment:
      <<: *database
      INSTALL_TB: "true"
      LOAD_DEMO: "false"
    depends_on:
      postgres: {condition: service_healthy}
    networks: [backend]
  thingsboard-ce:
    image: thingsboard/tb-node:4.3.1.5
    restart: unless-stopped
    ports:
      - "${TB_HTTP_PORT:-80}:8080"
      - "${TB_MQTT_PORT:-1883}:1883"
    environment:
      <<: *database
      TB_SERVICE_ID: classroom-tb-node
      DEFAULT_INACTIVITY_TIMEOUT: 20
      DEFAULT_STATE_CHECK_INTERVAL: 5
      TB_TRANSPORT_ACTIVITY_REPORTING_STRATEGY: ALL
      TB_TRANSPORT_SESSIONS_REPORT_TIMEOUT: 3000
    depends_on:
      postgres: {condition: service_healthy}
    networks: [backend]
  bootstrap:
    build: {context: .., dockerfile: deployment/Dockerfile.bootstrap}
    profiles: [bootstrap]
    user: "${HOST_UID:-0}:${HOST_GID:-0}"
    restart: "no"
    env_file: .env
    environment:
      TB_BASE_URL: http://thingsboard-ce:8080
    volumes: [./runtime:/runtime]
    depends_on: [thingsboard-ce]
    networks: [backend]
networks:
  backend:
volumes:
  postgres-data:

